[workspace]
resolver = "2"

# No standalone example projects currently excluded

members = [
    # Foundation
    "crates/songbird-process-env",
    "crates/songbird-types",
    "crates/songbird-config",
    "crates/songbird-canonical",
    "crates/songbird-universal",

    # Core services
    "crates/songbird-discovery",
    "crates/songbird-registry",
    "crates/songbird-network-federation",
    "crates/songbird-orchestrator",
    "crates/songbird-cli",

    # Development
    "crates/songbird-observability",
    "crates/songbird-test-utils",

    # Security & genesis
    "crates/songbird-genesis",
    "crates/songbird-execution-agent",

    # Shared crypto provider (Neural API routing)
    "crates/songbird-crypto-provider",

    # Protocols
    "crates/songbird-tor-protocol",
    "crates/songbird-sovereign-onion",
    "crates/songbird-onion-relay",
    "crates/songbird-quic",
    "crates/songbird-tls",
    "crates/songbird-http-client",
    "crates/songbird-stun",
    "crates/songbird-igd",
    "crates/songbird-nfc",
    "crates/songbird-bluetooth",

    # NAT traversal & relay
    "crates/songbird-lineage-relay",
    "crates/songbird-turn-client",

    # IPC
    "crates/songbird-universal-ipc",

    # Infrastructure
    "crates/songbird-remote-deploy",
    "crates/songbird-compute-bridge",
    "crates/songbird-primal-coordination",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.87"
license = "AGPL-3.0-or-later"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
repository = "https://github.com/ecoPrimals/SongBird"
homepage = "https://sporeprint.primals.eco"
documentation = "https://sporeprint.primals.eco/lab/"

[package]
name = "songbird"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Network Orchestration & Discovery Primal"
keywords = ["orchestrator", "network", "discovery", "p2p"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "songbird"
path = "src/lib.rs"

[[bin]]
name = "songbird"
path = "src/main.rs"
doc = false

[dependencies]
songbird-orchestrator = { path = "crates/songbird-orchestrator" }
songbird-compute-bridge = { path = "crates/songbird-compute-bridge" }
songbird-remote-deploy = { path = "crates/songbird-remote-deploy" }
songbird-discovery = { path = "crates/songbird-discovery" }
songbird-config = { path = "crates/songbird-config" }
songbird-types = { path = "crates/songbird-types" }
songbird-http-client = { path = "crates/songbird-http-client" }
songbird-stun = { path = "crates/songbird-stun" }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
songbird-process-env = { path = "crates/songbird-process-env" }
songbird-universal-ipc = { path = "crates/songbird-universal-ipc" }
futures-util = { workspace = true }

[lints]
workspace = true

[workspace.dependencies]
songbird-process-env = { path = "crates/songbird-process-env" }

# Canonical ecosystem types (shared across all organisms)
cellmembrane-types = { path = "../../gardens/cellMembrane/crates/cellmembrane-types" }

# Async
tokio = { version = "1.48", features = [
    "rt-multi-thread", "net", "io-util", "macros",
    "sync", "time", "fs", "signal", "process", "test-util",
] }
futures-util = "0.3.31"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
uuid = { version = "1.0", features = ["v4", "serde"] }
bincode = "1.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
toml = "0.8"

# Random
fastrand = "2.0"
getrandom = "0.3"
rand = "0.8"

# Concurrency
bitflags = "2.9"

# CLI
clap = { version = "4.0", features = ["derive", "env"] }
colored = "3.1"

# Networking
hickory-resolver = { version = "0.25", features = ["tokio"] }
socket2 = "0.6"

# Time
chrono = { version = "0.4", features = ["serde"] }


# HTTP
hyper = { version = "1.0", features = ["http1", "client", "server"] }
http-body-util = "0.1"
bytes = "1.0"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# System
dirs = "6.0"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

# Crypto primitives
sha2 = "0.10"
hmac = "0.12"

# Encoding
base64 = "0.22"
hex = "0.4"

# System identity
gethostname = "0.4"

# HTTP client utilities
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }

# RPC
tarpc = { version = "0.37", features = ["tokio1", "serde-transport", "serde-transport-bincode", "tcp"] }

[profile.bench]
opt-level = 3
debug = false
lto = true
codegen-units = 1

[profile.release]
opt-level = 3              # Maximum optimizations
lto = "fat"                # Full Link Time Optimization (slower build, faster runtime)
codegen-units = 1          # Single codegen unit (better optimization, slower build)
strip = false              # Keep symbols for now (can strip later)
panic = "abort"            # Smaller binary, faster panics
overflow-checks = true     # Security-first: detect integer overflow in release builds

[profile.release-with-debug]
inherits = "release"
debug = true

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

too_many_arguments = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
unwrap_used = "warn"
expect_used = "warn"
clone_on_ref_ptr = "warn"
unnecessary_wraps = "warn"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
cast_possible_wrap = "deny"

module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
cognitive_complexity = "allow"
significant_drop_tightening = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"
redundant_closure = "allow"
missing_errors_doc = "allow"
