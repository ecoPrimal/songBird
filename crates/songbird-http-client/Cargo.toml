[package]
name = "songbird-http-client"
version.workspace = true
edition.workspace = true
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Pure Rust HTTP/HTTPS client using security provider crypto delegation (Tower Atomic)"
license.workspace = true
repository = "https://github.com/ecoPrimals/SongBird"
homepage = "https://songbird-gaming.ecoprimals.dev"
keywords = ["http", "https", "tls", "pure-rust", "tower-atomic"]
categories = ["network-programming", "web-programming::http-client"]

[dependencies]
# Core songbird types (defaults for socket discovery)
songbird-process-env.workspace = true
songbird-types = { path = "../songbird-types" }
# HTTP protocol (Pure Rust)
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["client"] }
http = "1.0"
http-body-util = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
tracing = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
# Interop — From<anyhow::Error> convenience conversion for downstream consumers
anyhow = { workspace = true }
# Cryptography (Pure Rust)
sha2 = { workspace = true }
hex = { workspace = true }

# Secure random number generation (Pure Rust)
getrandom = { workspace = true }  # OS-provided CSPRNG
fastrand = { workspace = true }    # Fast fallback RNG

# Crypto delegation (security provider IPC)
songbird-crypto-provider = { path = "../songbird-crypto-provider" }

[lints]
workspace = true
[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "test-util"] }
tempfile = { workspace = true }
wiremock = "0.6"
tracing-subscriber = { workspace = true }
rand = { workspace = true }

[[example]]
name = "simple_get"
path = "examples/simple_get.rs"

[[example]]
name = "https_test"
path = "examples/https_test.rs"

