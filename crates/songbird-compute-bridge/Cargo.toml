[package]
name = "songbird-compute-bridge"
version.workspace = true
edition.workspace = true
description = "Agnostic compute service bridge for Songbird federation - works with ANY compute provider"
license.workspace = true
repository = "https://github.com/ecoPrimals/songbird"
readme = "README.md"
keywords = ["compute", "distributed", "orchestration", "bridge", "agnostic"]
categories = ["network-programming", "web-programming"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
gethostname = { workspace = true }

# Internal dependencies
songbird-process-env.workspace = true
songbird-types = { path = "../songbird-types" }
songbird-config = { path = "../songbird-config" }
songbird-http-client = { path = "../songbird-http-client" }  # ✅ 100% Pure Rust!

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "test-util"] }
tower = { workspace = true, features = ["util"] }

