[package]
name = "songbird-universal-ipc"
version.workspace = true
edition.workspace = true
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Universal IPC abstraction for ecoPrimals - works on ALL platforms"
license.workspace = true
repository = "https://github.com/ecoPrimals/SongBird"
keywords = ["ipc", "unix-socket", "named-pipe", "universal", "platform-agnostic"]
categories = ["os", "network-programming"]

[dependencies]
# Core async runtime
tokio = { workspace = true, features = ["net", "sync", "time", "io-util"] }
# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Serialization (for registry)
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }

# Time handling
chrono = { workspace = true }

# HTTP client (for IPC handlers)
songbird-http-client = { path = "../songbird-http-client" }

# STUN client (for NAT traversal)
songbird-stun = { path = "../songbird-stun" }

# Lineage Relay (for sovereign NAT traversal)
songbird-lineage-relay = { path = "../songbird-lineage-relay" }

# TURN client (for relay-backed cross-gate dispatch through NAT)
songbird-turn-client = { path = "../songbird-turn-client" }

# Onion Relay (for beacon mesh and hole punch)
songbird-onion-relay = { path = "../songbird-onion-relay" }

# Sovereign Onion Service (for NAT traversal via .onion addresses)
songbird-sovereign-onion = { path = "../songbird-sovereign-onion" }

# Pure Rust Tor Protocol (for symmetric NAT traversal)
songbird-tor-protocol = { path = "../songbird-tor-protocol" }

# Discovery (for peer registry bridge)
songbird-discovery = { path = "../songbird-discovery" }

# Federation node registry (IPC federation.* introspection)
songbird-network-federation = { path = "../songbird-network-federation" }

# IGD (for router port forwarding)
songbird-igd = { path = "../songbird-igd" }

# UUID generation
uuid = { workspace = true }

# Base64 encoding (for BirdSong beacons)
base64 = "0.22"

# HMAC-SHA256 for enrollment proof computation
hmac = { workspace = true }
sha2 = { workspace = true }

# Unix RPC client (re-export from songbird-universal)
songbird-universal = { path = "../songbird-universal" }

# Canonical primal identifiers
songbird-types = { path = "../songbird-types" }

# Canonical ecosystem types (shared JSON-RPC, health, discovery)
cellmembrane-types = { workspace = true }

# Crypto provider (BearDog delegation — signs IPC registrations)
songbird-crypto-provider = { path = "../songbird-crypto-provider" }

songbird-process-env.workspace = true

# TOML serialization (mesh peer persistence)
toml = { workspace = true }

# HTTP client for cross-gate dispatch (remote peers run axum HTTP servers)
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }

# TLS for external proxy outbound (HTTPS → GIS services, CA roots, etc.)
# Pure Rust: rustls-rustcrypto replaces ring (zero C dependencies).
rustls = { version = "0.23", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls-rustcrypto = "0.0.2-alpha"
rustls-native-certs = "0.8"

# Windows named pipes (only on Windows)
[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true

[dev-dependencies]
tokio-test = "0.4"
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util = { workspace = true }
songbird-test-utils = { path = "../songbird-test-utils" }

[features]
default = []
# Storage capability provider integration (capability domain: storage)
storage_provider = []
