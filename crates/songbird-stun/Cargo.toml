[package]
name = "songbird-stun"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/ecoPrimals/songbird"
readme = "README.md"
keywords = ["stun", "nat", "p2p", "pure-rust", "rfc5389"]
categories = ["network-programming"]
description = "Pure Rust STUN (RFC 5389) client for NAT traversal - zero C dependencies"
authors = ["ecoPrimals Team"]

[dependencies]
tokio = { workspace = true, features = ["net", "time", "sync"] }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
futures-util = { workspace = true }
clap = { workspace = true }

# RFC 5389 wire integrity
hmac = { workspace = true }
sha1 = "0.10"
crc32fast = "1"

# JSON serialization (for Cloudflare API)
serde_json = { workspace = true }

# Internal dependencies
songbird-types = { path = "../songbird-types" }
songbird-config = { path = "../songbird-config" }
songbird-process-env = { path = "../songbird-process-env" }

[lints]
workspace = true

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "test-util"] }
tokio-test = "0.4"

[lib]
path = "src/lib.rs"

